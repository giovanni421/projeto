<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Curiosidades</title>
    <link rel="icon" href="varinha.png">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
         margin: 0;
         min-height: 100vh;
         padding: 24px;
        font-family: Georgia, "Times New Roman", serif;
        color: white;
         background-image: linear-gradient(rgba(8, 12, 25, 0.55), rgba(8, 12, 25, 0.75)), url('fundo 2.jpg');
        background-size: cover;
        background-position: center;
            background-attachment: fixed;
        }

       a {
            color: #f0cc78;
            transition: color 0.3s, text-shadow 0.3s;
        }

     a:hover {
            color: white;
            text-shadow: 0 0 10px #d9ad50;
        }

     h1, h2 {
            text-shadow: 2px 2px 5px #000;
        }

        h1 {
            animation: aparecer 1s ease-out;
        }

        hr {
            border: 0;
            border-top: 1px solid #c79f54;
            margin: 24px 0;
        }

        iframe {
            max-width: 100%;
            border: 2px solid #c79f54;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        ul {
            padding-left: 30px;
            line-height: 1.8;
        }

        li {
            padding: 8px;
            transition: transform 0.2s, color 0.2s;
        }

        li:hover {
            color: #f0cc78;
            transform: translateX(6px);
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 700px) {
            body {
                padding: 16px;
                background-attachment: scroll;
            }

            iframe {
                display: block;
                float: none;
                width: 100%;
                height: 320px;
                margin: 20px 0;
            }

            h1 {
                text-align: left !important;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" style="font-size: 30px; color: white;">Voltar</a>
    <hr>

    <h1 align="right" style="font-size:25px; color: white;">Onde fica o Estúdio em que foi feito o Harry Potter?</h1>
    <hr>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2473.333635677065!2d-0.4207338235470009!3d51.69033939732275!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x487641b54856da0b%3A0x37abae1f5500e30!2sWarner%20Bros.%20Studio%20Tour%20London!5e0!3m2!1spt-BR!2sbr!4v1780267883188!5m2!1spt-BR!2sbr" align="right" width="600" height="450" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

    <h2 style="color: white; font-size: 28px;">Feitiços mais famosos de Harry Potter</h2>
    
    <ul style="color: white; font-size: 22px;">
        
    <li style="font-size: 28px;">🌟 Utilitário: Expecto Patronum</li>
        
    <li style="font-size: 28px;">⚔️ Duelo: Expelliarmus</li>
        
    <li style="font-size: 28px;">🌑 Magia Proibida: Avada Kedavra</li>
    </ul>
</body>
</html>
